name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
  VITE_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [marketing, storefront]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }},ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-deploy-spas:
    name: Build & deploy SPAs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, platform-admin]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter "@sanvi/${{ matrix.app }}..."

      - name: Deploy static output
        run: echo "Wire to the static host/CDN of choice (Cloudflare Pages, S3+CloudFront, ...) — no target configured yet in phase 00."

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-deploy-spas]
    environment: staging
    steps:
      - run: echo "Wire to the container platform of choice (Fly.io, ECS, Cloud Run, ...) — no target configured yet in phase 00."

  e2e-staging:
    name: e2e against staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    strategy:
      matrix:
        app: [marketing, storefront, admin, platform-admin]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter "@sanvi/${{ matrix.app }}" exec playwright install --with-deps chromium webkit

      - name: e2e against staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL_PREFIX }}${{ matrix.app }}${{ vars.STAGING_URL_SUFFIX }}
        run: pnpm --filter "@sanvi/${{ matrix.app }}" exec playwright test --config playwright.config.ts

  storybook:
    name: Publish Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter "@sanvi/ui" build

      - name: Publish
        run: echo "Wire to Chromatic or a static host — no target configured yet in phase 00."
