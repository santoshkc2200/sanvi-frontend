name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PUBLIC_API_ORIGIN: http://localhost:8080
  VITE_API_ORIGIN: http://localhost:8080

jobs:
  ci:
    name: lint, typecheck, test, build, gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: turbo lint typecheck test build
        run: pnpm turbo run lint typecheck test build

      - name: check:no-secret-keys-in-bundle
        run: |
          node scripts/check-no-secret-keys-in-bundle.mjs --self-test
          node scripts/check-no-secret-keys-in-bundle.mjs

      - name: check:connect-bundle
        run: pnpm check:connect-bundle

      - name: check:i18n
        run: pnpm turbo run check:i18n

      - name: check:tokens
        run: pnpm turbo run check:tokens

      - name: check:boundaries
        run: pnpm check:boundaries

      - name: check:budget
        run: pnpm turbo run check:budget

      - name: Bundle size comment
        if: always()
        run: node scripts/bundle-size-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/**'
          retention-days: 7
          if-no-files-found: ignore

  benchmarks:
    name: Perf & a11y harnesses (reporting-only)
    runs-on: ubuntu-latest
    # TASK-031 constraint: nothing here blocks. The three harnesses run
    # reporting-only until their baselines exist and TASK-022 (budgets,
    # Lighthouse) / TASK-027 (axe) switch them to blocking. A failed or
    # regressed report is still visible on the PR — the job fails, the PR
    # still merges, which is the intended behaviour at this stage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      # The pinned browser (scripts/perf-profiles.json pins Chrome; the
      # harnesses refuse to run on a different version).
      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: check:budget (report-only)
        run: pnpm check:budget --report-only

      - name: check:lighthouse (report-only)
        run: pnpm check:lighthouse --report-only

      - name: check:a11y (report-only)
        run: pnpm check:a11y --report-only

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            benchmarks/frontend/*.json
            apps/*/.lighthouseci/*.html
          retention-days: 14
          if-no-files-found: warn

  api-types-drift:
    name: OpenAPI types drift (advisory)
    runs-on: ubuntu-latest
    # Advisory until cross-repo checkout access to sanvi-backend is actually configured — same
    # "no target configured yet" convention main.yml uses for undeployed pieces. Requires a
    # `SANVI_BACKEND_CHECKOUT_TOKEN` secret (a PAT/deploy key with read access to sanvi-backend,
    # since the default GITHUB_TOKEN can't check out a sibling private repo) and assumes
    # sanvi-backend lives under the same GitHub org as this repo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: sanvi-frontend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sanvi-backend
          token: ${{ secrets.SANVI_BACKEND_CHECKOUT_TOKEN }}
          path: sanvi-backend

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: sanvi-frontend/.node-version
          cache: pnpm
          cache-dependency-path: sanvi-frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        working-directory: sanvi-frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI types from sanvi-backend
        working-directory: sanvi-frontend
        env:
          SANVI_BACKEND_DIR: ../sanvi-backend
        run: pnpm generate:api

      - name: Fail if the committed types have drifted from the backend contract
        working-directory: sanvi-frontend
        run: git diff --exit-code -- packages/api-client/openapi packages/api-client/src/generated

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        app: [marketing, storefront, admin, platform-admin]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter "@sanvi/${{ matrix.app }}" exec playwright install --with-deps chromium webkit

      - name: Build workspace dependencies
        run: pnpm turbo run build --filter "@sanvi/${{ matrix.app }}^..."

      - name: e2e
        run: pnpm --filter "@sanvi/${{ matrix.app }}" test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 7

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high+ severity)
        run: pnpm audit --audit-level=high
        continue-on-error: true # advisory until phase 00's DoD review tunes the threshold

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run per workspace package: at the root `--production` scans an empty
      # dependency set (the root only has devDependencies) and passes
      # vacuously — the apps' trees are what ships.
      - name: License check (every workspace package)
        run: |
          set -e
          for pkg in apps/* packages/*; do
            [ -f "$pkg/package.json" ] || continue
            echo "==> $pkg"
            (cd "$pkg" && pnpm exec license-checker-rseidelsohn --production --excludePrivatePackages --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0")
          done

      # cyclonedx-npm cannot read a pnpm workspace (it drives `npm ls`);
      # Syft scans the installed filesystem instead, toolchain-agnostic.
      - name: SBOM (CycloneDX via Syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: sbom.json

  osv:
    name: OSV dependency scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
